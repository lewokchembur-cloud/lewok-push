          vapidKey: 'BORkqpQI200CAz_fd8H7i4NW64rkzHrF7_uNCwp1KRNbM7qXGtkPO-QqwubJjx7xEzqbjaFZyE90-fsq1XCNhI0',

        });

        }

        alert("Aapne notification permission deny kar di!");
      }
    } catch (err) {
      alert("Error aa gaya: " + err.message);
      console.error(err);
    }
  }

  // 4. Send to Google Sheet
  function sendTokenToServer(token) {
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3CEHz01M2Vw5S9bxGTq0RAyj7D7DX7WiHNzhYsPJG5ySsPFdCfo75UraNYvwUkr29-w/exec"; 
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'SAVE_TOKEN', token: token }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(response => response.text())
    .then(result => {
      alert("Success! Google Sheet me save ho gaya.");
      console.log("Server Response:", result);
    })
    .catch(error => {
      alert("Server par bhejne me error aaya: " + error);
    });
  }

<script>
async function checkClick() {
    try {
      alert("Step 1: Permission mang rahe hain...");
      
      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        alert("Step 2: Permission mil gayi! Service worker check kar rahe hain...");
        
        // Service worker ready hone ka wait karein
        const swReg = await navigator.serviceWorker.ready;
        alert("Service worker ready hai, ab token le rahe hain...");

        const token = await messaging.getToken({ 
          vapidKey: 'BORkqpQI200CAz_fd8H7i4NW64rkzHrF7_uNCwp1KRNbM7qXGtkPO-QqwubJjx7xEzqbjaFZyE90-fsq1XCNhI0',
          serviceWorkerRegistration: swReg
        });
        
        if (token) {
          alert("Step 3: Token mil gaya! Google Sheet me bhej rahe hain...");
          console.log("Device Token:", token);

<script>
/* CONFIG & SETTINGS */
const API_URL = "https://script.google.com/macros/s/AKfycbw3CEHz01M2Vw5S9bxGTq0RAyj7D7DX7WiHNzhYsPJG5ySsPFdCfo75UraNYvwUkr29-w/exec";

const PRINTER_CONFIG = {
  autoPrint: true,
  restaurantName: "LE WOK",
  restaurantTagline: "Chinese Restaurant",
  address: "Dr. C. G Road, Above The Urban Shawarma, Jai Hind Market, Chembur Camp, Mumbai - 400024",
  phone: "8291901011",
  // 1. Yahan apna Google Review ka direct link daalein (jaise maps.app.goo.gl/... ya g.page/...)
  qrRateUs: "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent("https://search.google.com/local/writereview?placeid=ChIJnzxYU5bJ5zsRHmneIDYBJSI&source=g.page.m.dc._&laa=gpay-review-qr-tab-downloaded-card"),
  
  // 2. Yahan apna online ordering menu ya Blogger website ka link daalein
  qrMoreOrders: "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent("https://lewokfoodorder.blogspot.com/p/le-wok-food-order.html")
};

// Inline Service Worker setup for background sound & native notification
if ('serviceWorker' in navigator) {
    const swCode = `
        self.addEventListener('install', (e) => { self.skipWaiting(); });
        self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
        self.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'PLAY_ALERT') {
                self.registration.showNotification(event.data.title || "🚨 LE WOK NEW ORDER!", {
                    body: event.data.text || "Naya food order aaya hai!",
                    icon: "https://cdn-icons-png.flaticon.com/512/3176/3176346.png",
                    vibrate: [300, 100, 300, 100, 300],
                    tag: 'le-wok-kitchen-alert',
                    renotify: true,
                    requireInteraction: true
                });
            }
        });
    `;
    const swBlob = new Blob([swCode], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).then(reg => {
        if (Notification.permission !== 'granted') {
            Notification.requestPermission();
        }
    }).catch(err => console.log("SW error:", err));
}

let orders = [];
let filter = "ALL";
let lastOrderIds = new Set();
let firstLoad = true;
let alertTimer = null;
let alerting = false;
let audioCtx = null;
let audioUnlocked = false;

function unlockAudio(){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === "suspended"){
      audioCtx.resume();
    }
    audioUnlocked = true;
    document.getElementById("soundStatus").textContent = "SOUND ON";
  }catch(e){}
}
document.addEventListener("click", unlockAudio, {once:false});
document.addEventListener("touchstart", unlockAudio, {once:false});

function playAlertTone(){
  if(!audioUnlocked) return;
  try{
    const now = audioCtx.currentTime;
    function bell(start, freq, volume=0.7){
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.32);
    }
    bell(now, 980, 0.7);
    bell(now + 0.16, 1220, 0.7);
    bell(now + 0.52, 980, 0.7);
    bell(now + 0.68, 1220, 0.7);
  }catch(e){}
}

function playAlertSound() {
    try {
        let audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        audio.play().catch(e => console.log("Audio autoplay restricted by browser"));
    } catch(err) {}
}

function triggerBackgroundNotification(title, bodyText) {
    playAlertSound(); 
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ 
            type: 'PLAY_ALERT', 
            title: title, 
            text: bodyText 
        });
    }
}

function startNewOrderAlert(newOrders){
  if(!newOrders.length || alerting) return;
  alerting = true;
  const count = newOrders.length;
  document.getElementById("alertMessage").textContent = count + (count === 1 ? " new order waiting." : " new orders waiting.");
  document.getElementById("alertBar").classList.add("show");
  playAlertTone();
  triggerBackgroundNotification("🚨 LE WOK: NEW ORDER!", count + " naya food order receive hua hai! Kitchen check karein.");
  alertTimer = setInterval(() => {
    if(!hasPendingNewOrders()){
      stopNewOrderAlert();
      return;
    }
    playAlertTone();
  }, 3000);
}

function stopNewOrderAlert(){
  alerting = false;
  if(alertTimer) clearInterval(alertTimer);
  alertTimer = null;
  document.getElementById("alertBar").classList.remove("show");
}

function hasPendingNewOrders(){
  return orders.some(x => normalizeStatus(x.orderStatus) === "ORDER RECEIVED");
}

async function loadOrders(manual=false){
  const btn = document.getElementById("refreshBtn");
  if(manual){
    btn.disabled = true;
    btn.textContent = "Loading...";
  }
  try{
    const response = await fetch(API_URL + "?action=GET_ORDERS&ts=" + Date.now(), {cache:"no-store"});
    const data = await response.json();
    if(!data.ok) throw new Error(data.error || "Failed to load");

    const incoming = data.orders || [];
    const incomingIds = new Set(incoming.map(x => String(x.orderId || "")));
    const newlyArrived = !firstLoad ? incoming.filter(x => !lastOrderIds.has(String(x.orderId || ""))) : [];

    if(newlyArrived.some(x => normalizeStatus(x.orderStatus) === "ORDER RECEIVED")){
      startNewOrderAlert(newlyArrived.filter(x => normalizeStatus(x.orderStatus) === "ORDER RECEIVED"));
    }

    orders = incoming;
    lastOrderIds = incomingIds;
    firstLoad = false;

    if(!hasPendingNewOrders()) stopNewOrderAlert();

    renderStats();
    renderOrders();
    updateSync();
  }catch(err){
    console.error("Load error:", err);
  }finally{
    if(manual){
      btn.disabled = false;
      btn.textContent = "Refresh";
    }
  }
}

function updateSync(){
  const now = new Date();
  document.getElementById("lastSync").textContent = "Last sync: " + now.toLocaleTimeString("en-IN", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
}

function renderStats(){
  const status = orders.map(x => normalizeStatus(x.orderStatus));
  document.getElementById("newCount").textContent = status.filter(x => x === "ORDER RECEIVED").length;
  document.getElementById("preparingCount").textContent = status.filter(x => x === "PREPARING").length;
  document.getElementById("readyCount").textContent = status.filter(x => x === "READY").length;
  document.getElementById("deliveryCount").textContent = status.filter(x => x === "OUT FOR DELIVERY").length;
  document.getElementById("deliveredCount").textContent = status.filter(x => x === "DELIVERED").length;
}

function renderOrders(){
  const box = document.getElementById("orders");
  const search = document.getElementById("search").value.toLowerCase().trim();
  
  const list = orders.filter(order => {
    const status = normalizeStatus(order.orderStatus);
    const matchesFilter = filter === "ALL" || status === filter;
    const text = [order.orderId, order.customerNumber, order.itemName, order.address, order.itemCode].join(" ").toLowerCase();
    return matchesFilter && (!search || text.includes(search));
  });

  if(!list.length){
    box.innerHTML = `
      <div class="empty">
        <div class="emptyIcon">📭</div>
        <b>No Orders Found</b>
        <p>New incoming orders will appear here automatically.</p>
      </div>`;
    return;
  }

  box.innerHTML = list.map(order => orderCard(order)).join("");
}

function orderCard(o){
  const status = normalizeStatus(o.orderStatus);
  const payment = normalizePayment(o.paymentMethod);
  const isNew = status === "ORDER RECEIVED";
  const mapAvailable = hasLocation(o);
  let actionHTML = "";

  if(status === "ORDER RECEIVED"){
    actionHTML = `<button class="action primary" onclick="updateStatus('${safe(o.orderId)}','PREPARING',this)">⚡ ACCEPT / PREP</button>`;
  } else if(status === "PREPARING"){
    actionHTML = `<button class="action primary" onclick="updateStatus('${safe(o.orderId)}','READY',this)">✔ MARK READY</button>`;
  } else if(status === "READY"){
    actionHTML = `<div class="riderInfo">📦 WAITING FOR RIDER</div>`;
  } else if(status === "OUT FOR DELIVERY"){
    actionHTML = `<div class="riderInfo">🚀 RIDER OUT FOR DELIVERY</div>`;
  } else if(status === "DELIVERED"){
    actionHTML = `<div class="riderInfo">✅ ORDER COMPLETED</div>`;
  }

  return `
    <article class="orderCard ${isNew ? 'isNew' : ''}">
      ${isNew ? '<div class="newRibbon">NEW ORDER</div>' : ''}
      <div class="orderHead">
        <div>
          <div class="orderId">${esc(o.orderId || "ORDER")}</div>
          <div class="time">${esc(o.date || "")} &nbsp; ${esc(o.time || "")}</div>
          ${isNew ? `<div class="runningTimer" data-timer="${safe(o.date)} ${safe(o.time)}">00:00</div>` : ''}
        </div>
        <span class="badge ${statusClass(status)}">${esc(status)}</span>
      </div>
      <div class="itemBox">
        <div class="itemName">${esc(o.itemName || "Order")}</div>
        <div class="itemCode">Code: ${esc(o.itemCode || "-")}</div>
        <div class="amount">₹${money(o.finalAmount)}</div>
        <div class="amountLabel">TOTAL AMOUNT</div>
      </div>
      <div class="details">
        <div class="detail"><span class="detailIcon">📞</span><b>${esc(o.customerNumber || "-")}</b></div>
        <div class="detail address"><span class="detailIcon">📍</span><span>${esc(o.address || "-")}</span></div>
        <div class="detail"><span class="detailIcon">📏</span><span><b>${money(o.distanceKm)} KM</b> delivery distance</span></div>
      </div>
      <button class="mapButton ${mapAvailable ? '' : 'disabled'}" onclick="openMap('${safe(o.orderId)}')">🗺 OPEN GOOGLE MAPS</button>
      <div class="paymentRow">
        <div class="payment">PAYMENT<strong>${esc(payment)}</strong></div>
        <button class="payBtn ${paymentClass(payment)}" onclick="changePayment('${safe(o.orderId)}',this)">UPDATE</button>
      </div>
      <div class="actions">
        <button class="action dark" onclick="viewOrder('${safe(o.orderId)}')">VIEW</button>
        <button class="action dark" onclick="sendWhatsApp('${safe(o.orderId)}')">WHATSAPP</button>
        <button class="action" onclick="printExistingOrder('${safe(o.orderId)}')">🖨 PRINT</button>
        ${actionHTML}
      </div>
    </article>`;
}

async function updateStatus(orderId, newStatus, button){
  if(!button || button.disabled) return;
  if(newStatus === "PREPARING") stopNewOrderAlert();
  const oldText = button.textContent;
  button.disabled = true;
  button.classList.add("processing");
  button.textContent = "Updating...";
  try{
    const result = await postUpdate({action:"UPDATE_ORDER", orderId: orderId, orderStatus: newStatus});
    if(!result.ok) throw new Error(result.error || "Update failed");
    const order = orders.find(x => String(x.orderId) === String(orderId));
    if(order) order.orderStatus = newStatus;
    renderStats();
    renderOrders();
    setTimeout(() => loadOrders(false), 700);
  }catch(err){
    alert("Update failed:\n" + err.message);
    button.disabled = false;
    button.classList.remove("processing");
    button.textContent = oldText;
  }
}

async function changePayment(orderId, button){
  const order = orders.find(x => String(x.orderId) === String(orderId));
  if(!order) return;
  const current = normalizePayment(order.paymentMethod);
  let next = current === "CASH ON DELIVERY" ? "PENDING" : (current === "PENDING" ? "PAID" : "CASH ON DELIVERY");
  try{
    const result = await postUpdate({action:"UPDATE_ORDER", orderId: orderId, paymentMethod: next});
    if(!result.ok) throw new Error(result.error || "Payment update failed");
    order.paymentMethod = next;
    renderOrders();
  }catch(err){
    alert("Payment update failed:\n" + err.message);
  }
}

async function postUpdate(payload){
  const response = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload)
  });
  return await response.json();
}

function viewOrder(orderId){
  const o = orders.find(x => String(x.orderId) === String(orderId));
  if(!o) return;
  document.getElementById("popupStatus").textContent = normalizeStatus(o.orderStatus);
  document.getElementById("popupContent").innerHTML = `
    ${popup("ORDER ID", o.orderId)}
    ${popup("DATE & TIME", (o.date || "") + " " + (o.time || ""))}
    ${popup("CUSTOMER NUMBER", o.customerNumber)}
    ${popup("ITEM", o.itemName)}
    ${popup("ITEM CODE", o.itemCode)}
    ${popup("FOOD AMOUNT", "₹" + money(o.foodAmount))}
    ${popup("DELIVERY CHARGE", "₹" + money(o.deliveryCharge))}
    ${popup("FINAL TOTAL", "₹" + money(o.finalAmount))}
    ${popup("PAYMENT METHOD", o.paymentMethod)}
    ${popup("DISTANCE", money(o.distanceKm) + " KM")}
    ${popup("ADDRESS", o.address, "fullRow")}
  `;
  document.getElementById("popupWhatsApp").onclick = () => sendWhatsApp(o.orderId);
  document.getElementById("popupMaps").onclick = () => openMap(o.orderId);
  document.getElementById("overlay").classList.add("show");
}

function popup(title, value, cls=""){
  return `<div class="popupItem ${cls}"><span>${esc(title)}</span><b>${esc(value || "-")}</b></div>`;
}

function closePopup(e){
  if(e && e.target !== document.getElementById("overlay")) return;
  document.getElementById("overlay").classList.remove("show");
}

function openMap(orderId){
  const o = orders.find(x => String(x.orderId) === String(orderId));
  if(!o) return;
  let url = o.latitude && o.longitude ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.latitude + "," + o.longitude)}` : o.location;
  if(!url){ alert("Location unavailable."); return; }
  window.open(url, "_blank");
}

function sendWhatsApp(orderId){
  const o = orders.find(x => String(x.orderId) === String(orderId));
  if(!o) return;
  const msg = `*LE WOK - ORDER*\nOrder ID: ${o.orderId}\nItem: ${o.itemName}\nTotal: ₹${money(o.finalAmount)}\nPayment: ${o.paymentMethod}\nAddress: ${o.address}`;
  const phone = String(o.customerNumber || "").replace(/\D/g,"");
  if(!phone){ alert("Customer phone number unavailable."); return; }
  window.open("https://wa.me/91" + phone + "?text=" + encodeURIComponent(msg), "_blank");
}

function printExistingOrder(orderId){
  const order = orders.find(o => String(o.orderId || "") === String(orderId));
  if(!order){ alert("Order not found."); return; }
  printOrderReceipt(order);
}

function setFilter(value, el){
  filter = value;
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  el.classList.add("active");
  renderOrders();
}

document.getElementById("search").addEventListener("input", renderOrders);

function normalizeStatus(s){ return String(s || "ORDER RECEIVED").trim().toUpperCase(); }
function normalizePayment(p){
  const x = String(p || "Cash on Delivery").trim().toUpperCase();
  if(x === "PAID") return "PAID";
  if(x === "PENDING") return "PENDING";
  return "CASH ON DELIVERY";
}

function statusClass(s){
  if(s === "PREPARING") return "preparing";
  if(s === "READY") return "ready";
  if(s === "OUT FOR DELIVERY") return "delivery";
  if(s === "DELIVERED") return "delivered";
  if(s === "CANCELLED") return "cancelled";
  return "";
}

function paymentClass(p){
  if(p === "PAID") return "paid";
  if(p === "PENDING") return "pending";
  return "";
}

function money(v){
  const n = Number(v || 0);
  return isNaN(n) ? "0" : n.toLocaleString("en-IN");
}

function hasLocation(o){ return !!((o.latitude && o.longitude) || o.location); }

function esc(v){
  return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function safe(v){ return String(v || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }

function parseOrderDate(date, time){
  if(!date && !time) return null;
  let d = new Date(String(date || "") + " " + String(time || ""));
  if(!isNaN(d.getTime())) return d;
  const match = String(date || "").match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(match){
    const day = Number(match[1]), month = Number(match[2]) - 1, year = Number(match[3]);
    let hours = 0, minutes = 0, seconds = 0;
    const tm = String(time || "").match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);
    if(tm){
      hours = Number(tm[1]); minutes = Number(tm[2]); seconds = Number(tm[3] || 0);
      const ampm = String(tm[4] || "").toUpperCase();
      if(ampm === "PM" && hours < 12) hours += 12;
      if(ampm === "AM" && hours === 12) hours = 0;
    }
    d = new Date(year, month, day, hours, minutes, seconds);
    if(!isNaN(d.getTime())) return d;
  }
  return null;
}

function updateTimers(){
  document.querySelectorAll("[data-timer]").forEach(el => {
    const value = el.getAttribute("data-timer") || "";
    const parts = value.split(" ");
    const date = parts.shift() || "", time = parts.join(" ") || "";
    const created = parseOrderDate(date, time);
    if(!created){ el.textContent = "⏱ LIVE"; return; }
    const seconds = Math.max(0, Math.floor((Date.now() - created.getTime()) / 1000));
    const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
    el.textContent = "⏱ " + String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  });
}

/* STARTUP */
loadOrders();
setInterval(() => loadOrders(false), 5000);
setInterval(updateTimers, 1000);
updateTimers();

function formatReceiptDate(dateStr, timeStr) {
  let combined = String(dateStr || "").trim();
  if (timeStr && !combined.includes("T") && !combined.includes(" ")) {
    combined += " " + String(timeStr).trim();
  }

  let d = new Date(dateStr);
  if (isNaN(d.getTime()) && timeStr) {
    d = new Date(timeStr);
  }

  if (!isNaN(d.getTime())) {
    return d.toLocaleString("en-IN", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: true
    });
  }

  let cleanDate = String(dateStr || "").split("T")[0];
  let cleanTime = String(timeStr || "").split("T")[1] ? String(timeStr).split("T")[1].replace("Z", "") : "";
  if(cleanDate.startsWith("1899")) cleanDate = "Today";
  
  return `${cleanDate} ${cleanTime}`.trim() || "--";
}
